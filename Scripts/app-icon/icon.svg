<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.32" cy="0.16" r="0.85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.65" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="kgrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCE1F5"/>
    </linearGradient>
    <filter id="dsBig" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1E1448" flood-opacity="0.35"/>
    </filter>
    <filter id="dsSmall" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1E1448" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- squircle background -->
  <path d="M 285 100 H 739 Q 924 100 924 285 V 739 Q 924 924 739 924 H 285 Q 100 924 100 739 V 285 Q 100 100 285 100 Z" fill="url(#bg)"/>
  <path d="M 285 100 H 739 Q 924 100 924 285 V 739 Q 924 924 739 924 H 285 Q 100 924 100 739 V 285 Q 100 100 285 100 Z" fill="url(#sheen)"/>

  <!-- sparkles -->
  <g fill="#FFFFFF" opacity="0.3">
    <circle cx="240" cy="262" r="8"/>
    <circle cx="330" cy="200" r="6"/>
    <circle cx="210" cy="545" r="7"/>
    <circle cx="560" cy="218" r="7"/>
  </g>

  <!-- K -->
  <g filter="url(#dsBig)" stroke="url(#kgrad)" stroke-linecap="round" fill="none">
    <path d="M 300 320 V 700" stroke-width="130"/>
    <path d="M 420 510 L 680 305" stroke-width="116"/>
    <path d="M 420 510 L 690 680" stroke-width="116"/>
  </g>

  <!-- ++ marks -->
  <g stroke-linecap="round" filter="url(#dsSmall)">
    <g transform="rotate(10 822 246)">
      <path d="M 822 198 V 294 M 774 246 H 870" stroke="#FB923C" stroke-width="34"/>
    </g>
    <g transform="rotate(-8 866 372)">
      <path d="M 866 338 V 406 M 832 372 H 900" stroke="#FBBF24" stroke-width="26"/>
    </g>
  </g>

  <!-- boy mascot -->
  <g filter="url(#dsSmall)">
    <!-- bust (hoodie) -->
    <path d="M 650 854 L 650 832 Q 650 770 718 770 L 842 770 Q 910 770 910 832 L 910 854 Q 910 892 872 892 L 688 892 Q 650 892 650 854 Z" fill="#F97316"/>
    <!-- hoodie drawstrings -->
    <path d="M 767 784 q -6 22 -2 36" stroke="#FFF7ED" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.95"/>
    <path d="M 793 784 q 6 22 2 36" stroke="#FFF7ED" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.95"/>

    <!-- pencil -->
    <g transform="rotate(22 780 812)">
      <rect x="716" y="792" width="140" height="40" rx="5" fill="#FACC15"/>
      <polygon points="716,792 716,832 668,812" fill="#FEF3C7"/>
      <polygon points="682,806 682,818 664,812" fill="#334155"/>
      <rect x="856" y="791" width="18" height="42" fill="#CBD5E1"/>
      <rect x="872" y="788" width="32" height="48" rx="13" fill="#FB7185"/>
    </g>

    <!-- ears -->
    <circle cx="670" cy="700" r="20" fill="#FFD3AD"/>
    <circle cx="890" cy="700" r="20" fill="#FFD3AD"/>

    <!-- head -->
    <circle cx="780" cy="688" r="110" fill="#FFD3AD"/>

    <!-- hair -->
    <path d="M 670 688 A 110 110 0 0 1 890 688 L 890 700 Q 870 650 830 658 Q 801 664 780 652 Q 759 664 730 658 Q 690 650 670 700 Z" fill="#4A312C"/>
    <path d="M 769 588 C 757 554 787 540 811 550" stroke="#4A312C" stroke-width="15" stroke-linecap="round" fill="none"/>

    <!-- face -->
    <path d="M 727 676 Q 743 666 759 676" stroke="#4A312C" stroke-width="11" stroke-linecap="round" fill="none"/>
    <path d="M 801 676 Q 817 666 833 676" stroke="#4A312C" stroke-width="11" stroke-linecap="round" fill="none"/>
    <circle cx="743" cy="696" r="15" fill="#2B2440"/>
    <circle cx="817" cy="696" r="15" fill="#2B2440"/>
    <circle cx="737" cy="690" r="5" fill="#FFFFFF"/>
    <circle cx="811" cy="690" r="5" fill="#FFFFFF"/>
    <circle cx="711" cy="728" r="16" fill="#FB7185" opacity="0.45"/>
    <circle cx="849" cy="728" r="16" fill="#FB7185" opacity="0.45"/>
    <path d="M 757 730 Q 780 754 803 730" stroke="#93402F" stroke-width="12" stroke-linecap="round" fill="none"/>

    <!-- hands gripping the pencil -->
    <circle cx="743" cy="797" r="26" fill="#FFD3AD"/>
    <circle cx="813" cy="825" r="26" fill="#FFD3AD"/>
  </g>

  <!-- rim highlight -->
  <path d="M 285 100 H 739 Q 924 100 924 285 V 739 Q 924 924 739 924 H 285 Q 100 924 100 739 V 285 Q 100 100 285 100 Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="6"/>
</svg>
